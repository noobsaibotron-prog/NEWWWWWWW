orchestrator:
  name: "aieq-plugin-auditor"
  version: "1.3"
  formal_promoted_state: "1.1"
  governance_state: "frozen-pending-composite-regression"
  description: >
    Routes AIEQ plugin project artifacts to specialized sub-skills and synthesizes a hierarchical report.
    The implemented orchestration surface is v1.3; the last fully promoted composite state remains v1.1.

routing_rules:
  - pattern: "Source/DSP/**"
    sub_skill: "dsp-safety-audit"
    domain: "ENGINEERING"
  - pattern: "Source/Core/**"
    sub_skill: "dsp-safety-audit"
    domain: "ENGINEERING"
  - pattern: "Source/GUI/**"
    sub_skill: "gui-performance-audit"
    domain: "ENGINEERING"
  - pattern: "Source/AI/**"
    sub_skill: "ai-integration-audit"
    domain: "ENGINEERING"
  - pattern: "PluginProcessor.*"
    sub_skill: "dsp-safety-audit"
    domain: "ENGINEERING"
  - pattern: "PluginEditor.*"
    sub_skill: "gui-performance-audit"
    domain: "ENGINEERING"
  - pattern: "Source/Tests/**"
    sub_skill: "test-quality-audit"
    domain: "ENGINEERING"
  - pattern: "Source/Core/HistoryManager.*"
    sub_skill: "state-management-audit"
    domain: "ENGINEERING"
  - pattern: "Source/Core/OSCParameterServer.*"
    sub_skill: "state-management-audit"
    domain: "ENGINEERING"
  - pattern: "CMakeLists.txt"
    sub_skill: "build-system-audit"
    domain: "ENGINEERING"
  - pattern: "*.sh"
    sub_skill: "build-system-audit"
    domain: "ENGINEERING"
  - pattern: "*.ps1"
    sub_skill: "build-system-audit"
    domain: "ENGINEERING"
  - pattern: "*.cmd"
    sub_skill: "build-system-audit"
    domain: "ENGINEERING"
  - pattern: "*.bat"
    sub_skill: "build-system-audit"
    domain: "ENGINEERING"
  - pattern: "Source/DSP/**"
    sub_skill: "dsp-correctness-audit"
    domain: "ENGINEERING"
  - pattern: "Source/**"
    sub_skill: "code-hygiene-audit"
    domain: "ENGINEERING"

regression_matrix:
  enabled: true
  description: >
    When any sub-skill is promoted, the orchestrator must re-run
    the eval suites of all relevant sub-skills on the same artifact bundle
    to verify no cross-domain interference occurred.
  trigger: "sub_skill_promotion"
  action: "run_all_evals"

synthesis_rules:
  conflict_detection:
    - pair: ["dsp-safety-audit", "ai-integration-audit"]
      watch_for: "Direct AI inference or mutex reachability from the audio path"
      evidence_anchor: "processBlock or audio-thread helpers calling AI methods that synchronously infer or acquire mutexes."
      resolution_priority: "dsp-safety-audit"
    - pair: ["ai-integration-audit", "dsp-safety-audit"]
      watch_for: "AI shared-state hazard across thread boundaries"
      evidence_anchor: "audio-thread setters or snapshots mutating non-atomic/shared structs consumed on an AI worker thread."
      resolution_priority: "ai-integration-audit"
    - pair: ["gui-performance-audit", "dsp-safety-audit"]
      watch_for: "Spectrum pipeline contention"
      evidence_anchor: "shared locks or frame handoff patterns between GUI rendering and DSP processing."
      resolution_priority: "dsp-safety-audit"
    - pair: ["ai-integration-audit", "dsp-safety-audit"]
      watch_for: "CaptureService consumer stall"
      evidence_anchor: "AI or analysis thread stalling and causing lock-free ring buffer overflow from the DSP thread."
      resolution_priority: "dsp-safety-audit"
    - pair: ["gui-performance-audit", "ai-integration-audit"]
      watch_for: "Direct processor calls vs APVTS or lock-free UI handoff"
      evidence_anchor: "GUI panels calling processor or AI methods directly instead of using attachments, snapshots, or lock-free handoff."
      resolution_priority: "gui-performance-audit"
  state_vector:
    collapse_rule: "minimum"
    display: "always show per-sub-skill states"
