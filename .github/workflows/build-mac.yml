name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15          # Apple Silicon (M1) runner
    timeout-minutes: 30

    strategy:
      matrix:
        config: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake || true
          cmake --version
          xcodebuild -version

      - name: Configure CMake (Xcode, Universal Binary)
        run: |
          cmake -S . -B build-mac -G "Xcode" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build (${{ matrix.config }})
        run: |
          cmake --build build-mac --config ${{ matrix.config }} -- -quiet

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find build-mac/AIEqualizerPro_artefacts -type f \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) 2>/dev/null || true
          ls -la build-mac/AIEqualizerPro_artefacts/${{ matrix.config }}/ 2>/dev/null || true

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AI-Equalizer-Pro-macOS-VST3
          path: build-mac/AIEqualizerPro_artefacts/${{ matrix.config }}/VST3/
          if-no-files-found: warn

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: AI-Equalizer-Pro-macOS-AU
          path: build-mac/AIEqualizerPro_artefacts/${{ matrix.config }}/AU/
          if-no-files-found: warn

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: AI-Equalizer-Pro-macOS-Standalone
          path: build-mac/AIEqualizerPro_artefacts/${{ matrix.config }}/Standalone/
          if-no-files-found: warn
