name: Build macOS

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45

    strategy:
      matrix:
        config: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake || true
          cmake --version
          xcodebuild -version

      - name: Configure CMake (Xcode, Universal Binary)
        run: |
          cmake -S . -B build-mac -G "Xcode" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build (${{ matrix.config }})
        run: |
          cmake --build build-mac --config ${{ matrix.config }} -- -quiet

      - name: Run regression tests (ctest)
        working-directory: build-mac
        run: ctest --build-config ${{ matrix.config }} --output-on-failure --timeout 120

      - name: Install pinned pluginval
        env:
          PLUGINVAL_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
        run: |
          curl -fsSL \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip \
            -o "$RUNNER_TEMP/pluginval_macOS.zip"
          echo "$PLUGINVAL_SHA256  $RUNNER_TEMP/pluginval_macOS.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/pluginval_macOS.zip" "$RUNNER_TEMP/pluginval"
          chmod +x "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Validate VST3 and AU (blocking)
        env:
          PLUGINVAL_BIN: ${{ runner.temp }}/pluginval/pluginval.app/Contents/MacOS/pluginval
          PLUGINVAL_STRICTNESS: 10
        run: scripts/validate-macos-artifacts.sh build-mac ${{ matrix.config }}

      - name: Find and list build artifacts
        id: find_artifacts
        run: |
          echo "=== All build artifacts ==="
          find build-mac -type d \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) 2>/dev/null || true
          echo ""
          echo "=== Artefacts directory structure ==="
          find build-mac/AIEqualizerPro_artefacts -type d 2>/dev/null | head -30 || true
          echo ""
          VST3_PATH=$(find build-mac -type d -name "*.vst3" | head -1)
          echo "VST3 found at: $VST3_PATH"
          if [ -n "$VST3_PATH" ]; then
            VST3_DIR=$(dirname "$VST3_PATH")
            echo "vst3_dir=$VST3_DIR" >> $GITHUB_OUTPUT
          fi
          echo ""
          AU_PATH=$(find build-mac -type d -name "*.component" | head -1)
          echo "AU found at: $AU_PATH"
          if [ -n "$AU_PATH" ]; then
            AU_DIR=$(dirname "$AU_PATH")
            echo "au_dir=$AU_DIR" >> $GITHUB_OUTPUT
          fi
          echo ""
          APP_PATH=$(find build-mac -type d -name "*.app" | grep -iv "Xcode" | head -1)
          echo "Standalone found at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT
          fi

      - name: Upload VST3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find_artifacts.outputs.vst3_dir != ''
        with:
          name: AI-Equalizer-Pro-macOS-VST3
          path: ${{ steps.find_artifacts.outputs.vst3_dir }}/
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find_artifacts.outputs.au_dir != ''
        with:
          name: AI-Equalizer-Pro-macOS-AU
          path: ${{ steps.find_artifacts.outputs.au_dir }}/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find_artifacts.outputs.app_dir != ''
        with:
          name: AI-Equalizer-Pro-macOS-Standalone
          path: ${{ steps.find_artifacts.outputs.app_dir }}/
          if-no-files-found: error

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AI-Equalizer-Pro-macOS-validation
          path: build-mac/validation-reports/
          if-no-files-found: error

  ml-v3-regression:
    # The complete 738-test suite takes about eight minutes on the frozen local
    # arm64 environment.  Keep that cost explicit and parallel to the plug-in
    # build instead of silently extending its build/validator critical path.
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        run: brew install cmake ninja

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Materialize the frozen Motore v3 environment
        run: |
          uv python install 3.12.13
          uv venv --python 3.12.13 "$RUNNER_TEMP/motore-v3-venv"
          uv pip sync --require-hashes \
            --python "$RUNNER_TEMP/motore-v3-venv/bin/python" \
            ml_v3/environment/requirements.lock

      - name: Register the complete suite in CTest
        run: |
          cmake -S ml_v3 -B build-ml-v3 -G Ninja \
            -DAIEQ_ML_V3_PYTHON="$RUNNER_TEMP/motore-v3-venv/bin/python"
          test "$(ctest --test-dir build-ml-v3 -N -R '^aieq_ml_v3_regression$' \
            | grep -c 'Test #[0-9][0-9]*: aieq_ml_v3_regression')" -eq 1

      - name: Run the blocking Motore v3 regression gate
        run: |
          PYTHONDONTWRITEBYTECODE=1 ctest --test-dir build-ml-v3 \
            -R '^aieq_ml_v3_regression$' \
            --output-on-failure \
            --timeout 900
          test -z "$(find ml_v3 -type d -name __pycache__ -print -quit)"
          test -z "$(find ml_v3 -type f -name '*.pyc' -print -quit)"
