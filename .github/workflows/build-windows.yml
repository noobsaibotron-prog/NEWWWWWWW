name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      matrix:
        config: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Configure CMake (Visual Studio 2022)
        # Use the VS 2022 generator — already supported by CMakeLists.txt.
        # No NMake flags needed; CMakeLists.txt handles compiler detection automatically.
        run: |
          cmake -S . -B build-win ^
            -G "Visual Studio 17 2022" ^
            -A x64
        shell: cmd

      - name: Build plugin (${{ matrix.config }})
        run: cmake --build build-win --config ${{ matrix.config }} --parallel
        shell: cmd

      - name: Build DSP tests
        # Links only DSP modules (no TFLite/Torch) — always safe to build.
        run: cmake --build build-win --config ${{ matrix.config }} --target AIEqualizerPro_Tests --parallel
        shell: cmd

      - name: Build AI engine tests
        # Links AI modules only (no TFLite/Torch) — exercises AIEngine behaviour.
        run: cmake --build build-win --config ${{ matrix.config }} --target AIEqualizerPro_AI_Tests --parallel
        shell: cmd

      - name: Run all regression tests
        working-directory: build-win
        run: ctest --build-config ${{ matrix.config }} --output-on-failure --timeout 60
        shell: cmd

      - name: Install pinned pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip `
            -OutFile "$env:RUNNER_TEMP\pluginval_Windows.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\pluginval_Windows.zip" -Algorithm SHA256).Hash.ToLower()
          $expected = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          if ($actual -ne $expected) { throw "pluginval checksum mismatch: $actual" }
          Expand-Archive "$env:RUNNER_TEMP\pluginval_Windows.zip" `
            -DestinationPath "$env:RUNNER_TEMP\pluginval"

      - name: Validate VST3 (blocking)
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build-win -Recurse -Filter "*.vst3" -Directory)
          if ($plugins.Count -ne 1) { throw "Expected exactly one VST3, found $($plugins.Count)" }
          $packagedWeights = Join-Path $plugins[0].FullName "Contents/Resources/models/ml_weights.bin"
          if (-not (Test-Path $packagedWeights -PathType Leaf)) { throw "Packaged ML weights are missing: $packagedWeights" }
          $sourceHash = (Get-FileHash "Resources/Models/ml_weights.bin" -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash $packagedWeights -Algorithm SHA256).Hash
          if ($sourceHash -ne $packagedHash) { throw "Packaged ML weights do not match the source model" }
          New-Item -ItemType Directory -Force -Path build-win/validation-reports/pluginval | Out-Null
          & "$env:RUNNER_TEMP\pluginval\pluginval.exe" `
            --strictness-level 10 `
            --output-dir build-win/validation-reports/pluginval `
            $plugins[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }

      - name: Find VST3 artifact
        id: find_vst3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build-win -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1
          if ($vst3) {
            $dir = $vst3.Parent.FullName
            Write-Output "vst3_dir=$dir" >> $env:GITHUB_OUTPUT
            Write-Output "VST3 found: $($vst3.FullName)"
          } else {
            Write-Output "No VST3 artifact found — checking artefacts folder..."
            Get-ChildItem -Path build-win -Recurse | Where-Object { $_.Name -match "vst3|artefact" } | Select-Object FullName
          }

      - name: Upload VST3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find_vst3.outputs.vst3_dir != ''
        with:
          name: AI-Equalizer-Pro-Windows-VST3
          path: ${{ steps.find_vst3.outputs.vst3_dir }}/
          if-no-files-found: error

      - name: Upload test results on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-results-windows
          path: build-win/Testing/
          if-no-files-found: ignore

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AI-Equalizer-Pro-Windows-validation
          path: build-win/validation-reports/
          if-no-files-found: error
