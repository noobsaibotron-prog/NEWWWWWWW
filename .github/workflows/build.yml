name: AIEQ Build CI

on:
  push:
    branches:
      - feature/visual-rebranding-premium
      - review/codex-2026-04-01
      - main
  pull_request:
    branches:
      - main
      - review/codex-2026-04-01

jobs:
  build-macos:
    name: Build macOS (VST3 + Standalone)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build plugin
        run: |
          cmake --build build \
            --config Debug \
            --target AIEqualizerPro_VST3 AIEqualizerPro_Standalone \
            -j$(sysctl -n hw.logicalcpu)

      - name: Verify build artifacts
        run: |
          echo "=== Build artifacts ==="
          find build -name "*.vst3" -o -name "*.app" 2>/dev/null | head -10
          echo "=== Build successful ==="

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AIEqualizerPro-VST3-macOS-${{ github.sha }}
          path: build/**/*.vst3
          retention-days: 1

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()
    steps:
      - name: Report build status
        run: |
          if [ "${{ needs.build-macos.result }}" == "success" ]; then
            echo "✅ Build PASSED"
          else
            echo "❌ Build FAILED"
            exit 1
          fi
